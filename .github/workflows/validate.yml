name: HACS Validate

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands topics description license

  js:
    name: Kod karty – lint, testy, budowanie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sprawdzenie kodu (ESLint)
        run: npm run lint
      - name: Testy
        run: npm test
      - name: Budowanie dist/ z src/
        run: npm run build
      - name: dist/ zgodny ze źródłami
        run: git diff --exit-code dist/ || (echo "::error::dist/roleta-realistyczna.js nie pasuje do src/ – uruchom npm run build" && exit 1)
      - name: Składnia JS
        run: node --check dist/roleta-realistyczna.js
