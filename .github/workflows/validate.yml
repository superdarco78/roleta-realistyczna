name: HACS Validate

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands topics description license

  js:
    name: Sprawdzenie pliku karty (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Składnia JS
        run: node --check dist/roleta-realistyczna.js
      - name: Wersja w pliku = wersja w CHANGELOG
        run: |
          JS=$(grep -oE "RR_WERSJA *= *'v[0-9]+'" dist/roleta-realistyczna.js | grep -oE 'v[0-9]+')
          CL=$(grep -m1 -oE '^## v[0-9]+' CHANGELOG.md | grep -oE 'v[0-9]+')
          echo "plik: $JS, changelog: $CL"
          test "$JS" = "$CL"
