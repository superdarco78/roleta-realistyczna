name: 🚀 Wydanie

# Nowa wersja = nowy pierwszy nagłówek „## vNN – tytuł” w CHANGELOG.md.
# Po wysłaniu na main powstaje wydanie vNN z plikiem dist/roleta-realistyczna.js,
# a HACS pokazuje je w Home Assistancie jako aktualizację.
# Wygląd opisu wydania: .github/release-notes.md, obrazek wersji: img/wydania/vNN.png.
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md', 'dist/**', '.github/release-notes.md', 'img/wydania/**', 'scripts/notatki-wydania.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/notatki-wydania.mjs "$GITHUB_REPOSITORY" > notes.md
          ver=$(grep -m1 -E '^## v[0-9]+' CHANGELOG.md | grep -oE 'v[0-9]+(\.[0-9]+)*' | head -1)
          title=$(grep -m1 -E '^## v[0-9]+' CHANGELOG.md | sed -E 's/^## //')
          if gh release view "$ver" >/dev/null 2>&1; then
            gh release edit "$ver" --title "$title" --notes-file notes.md
            gh release upload "$ver" dist/roleta-realistyczna.js --clobber
          else
            gh release create "$ver" dist/roleta-realistyczna.js --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
          fi
